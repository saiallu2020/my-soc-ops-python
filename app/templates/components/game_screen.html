<div id="game-container">
<div class="flex flex-col min-h-full bg-page">
    <header class="header">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="btn-ghost">
            Back
        </button>
        <h1 class="header__title">Soc Ops</h1>
        <div class="header__spacer"></div>
    </header>

    {% if session.has_bingo %}
    <div class="bingo-banner">
        Bingo — you completed a line
    </div>
    {% endif %}

    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
