<div id="game-container">
<div class="flex flex-col items-center justify-center min-h-full p-6 bg-page">
    <div class="text-center max-w-sm animate-fade-in">
        <h1 class="text-display font-bold text-primary tracking-tight mb-2">Soc Ops</h1>
        <p class="text-subhead text-secondary mb-12">Social Bingo</p>

        <div class="text-left mb-12 space-y-3">
            <p class="text-body text-secondary">Find people who match the prompts.</p>
            <p class="text-body text-secondary">Tap a square when you find someone.</p>
            <p class="text-body text-secondary">Get five in a row to win.</p>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="w-full btn-primary">
            Start Game
        </button>
    </div>
</div>
</div>
